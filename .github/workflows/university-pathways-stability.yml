name: Synthetic university pathways stability and selection audit

on:
  push:
    paths:
      - "05-reproducible-examples/university-pathways/stability_selection_audit.py"
      - "05-reproducible-examples/university-pathways/tests/test_stability_selection_audit.py"
      - ".github/workflows/university-pathways-stability.yml"
  workflow_dispatch:

jobs:
  stability-selection-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 05-reproducible-examples/university-pathways
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install scientific dependencies
        run: python -m pip install -r requirements.txt
      - name: Run sensitivity tests
        run: python -m unittest discover -s tests -p 'test_stability_selection_audit.py' -v
      - name: Execute ten-seed stability and selection audit
        env:
          OPENBLAS_NUM_THREADS: "1"
        run: python stability_selection_audit.py --output results/stability_selection_audit.json
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: university-pathways-stability-audit
          path: 05-reproducible-examples/university-pathways/results/stability_selection_audit.json
          retention-days: 90
